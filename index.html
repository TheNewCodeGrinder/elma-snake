<!DOCTYPE html>
<html>
<head>
  <title>Elma Snake</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; display: flex; gap: 24px; padding: 20px; }
    canvas { border: 1px solid #333; }
    #right { width: 180px; }
    input { background: #111; color: #fff; border: 1px solid #333; padding: 6px; width: 100%; margin-bottom: 6px; }
    button { background: #111; color: #fff; border: 1px solid #333; padding: 6px 12px; cursor: pointer; }
    #lb li { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #222; font-size: 13px; }
    #status { font-size: 12px; color: #aaa; margin: 6px 0; }
  </style>
</head>
<body>
<canvas id="c" width="400" height="400"></canvas>
<div id="right">
  <div>score: <span id="sv">0</span></div>
  <div id="status">press arrow key to start</div>
  <input id="pname" placeholder="your name" maxlength="12" />
  <button onclick="saveScore()">save score</button>
  <h3 style="margin:12px 0 6px;font-size:13px;color:#aaa;">leaderboard</h3>
  <ul id="lb" style="list-style:none;padding:0;"></ul>
</div>
<script>
const DB = "https://elma-snake-default-rtdb.europe-west1.firebasedatabase.app";
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const CELL = 20, COLS = 20, ROWS = 20;
let snake, dir, nextDir, apple, score, gameState, animId;

function rand() { return Math.floor(Math.random() * COLS); }

function startGame() {
  snake = [{x:10,y:10}];
  dir = {x:1,y:0}; nextDir = {x:1,y:0};
  apple = {x:rand(),y:rand()};
  score = 0; gameState = 'running';
  document.getElementById('sv').textContent = 0;
  document.getElementById('status').textContent = '';
  if (animId) clearInterval(animId);
  animId = setInterval(tick, 120);
}

function tick() {
  dir = {...nextDir};
  const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
  if (head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS) { endGame(); return; }
  snake.unshift(head);
  if (head.x===apple.x&&head.y===apple.y) {
    score++;
    document.getElementById('sv').textContent = score;
    apple = {x:rand(),y:rand()};
  } else { snake.pop(); }
  draw();
}

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0,0,400,400);
  snake.forEach((s,i) => {
    ctx.fillStyle = '#00E600'; ctx.globalAlpha = i===0?1:0.7;
    ctx.fillRect(s.x*CELL+1, s.y*CELL+1, CELL-2, CELL-2);
  });
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#FF3333';
  ctx.fillRect(apple.x*CELL+1, apple.y*CELL+1, CELL-2, CELL-2);
  if (gameState==='over') {
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,400,400);
    ctx.fillStyle='#fff'; ctx.font='500 28px sans-serif'; ctx.textAlign='center';
    ctx.fillText('game over', 200, 190);
    ctx.font='16px sans-serif'; ctx.fillStyle='#aaa';
    ctx.fillText('score: '+score, 200, 220);
  }
  if (gameState==='idle') {
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,0,400,400);
    ctx.fillStyle='#fff'; ctx.font='500 20px sans-serif'; ctx.textAlign='center';
    ctx.fillText('elma snake', 200, 190);
    ctx.font='14px sans-serif'; ctx.fillStyle='#aaa';
    ctx.fillText('press arrow key to start', 200, 220);
  }
}

function endGame() {
  clearInterval(animId); gameState='over'; draw();
  document.getElementById('status').textContent = 'save your score!';
  loadLeaderboard();
}

document.addEventListener('keydown', e => {
  if (!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)) return;
  e.preventDefault();
  if (gameState==='idle') { startGame(); return; }
  if (gameState!=='running') return;
  if (e.key==='ArrowLeft') nextDir={x:-1,y:0};
  if (e.key==='ArrowRight') nextDir={x:1,y:0};
  if (e.key==='ArrowUp') nextDir={x:0,y:-1};
  if (e.key==='ArrowDown') nextDir={x:0,y:1};
});

async function saveScore() {
  const name = document.getElementById('pname').value.trim() || 'anonymous';
  if (score===0) { document.getElementById('status').textContent='score must be above 0'; return; }
  document.getElementById('status').textContent = 'saving...';
  try {
    const r = await fetch(`${DB}/scores.json`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name, score, date: Date.now()})
    });
    if (r.ok) { document.getElementById('status').textContent='saved!'; loadLeaderboard(); }
    else document.getElementById('status').textContent='save failed';
  } catch(e) { document.getElementById('status').textContent='save failed'; }
}

async function loadLeaderboard() {
  try {
    const r = await fetch(`${DB}/scores.json`);
    const data = await r.json();
    const lb = document.getElementById('lb');
    if (!data) { lb.innerHTML='<li style="color:#aaa;font-size:12px;">no scores yet</li>'; return; }
    const entries = Object.values(data).sort((a,b)=>b.score-a.score).slice(0,10);
    lb.innerHTML = entries.map((e,i)=>`<li><span>${i+1}. ${e.name}</span><span>${e.score}</span></li>`).join('');
  } catch(e) {}
}

gameState='idle'; draw(); loadLeaderboard();
</script>
</body>
</html>
